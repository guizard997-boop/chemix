name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build mobile web assets
        run: npm run build:mobile

      - name: Check web build
        run: |
          test -f www/index.html
          test -f release.keystore

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Apply flask launcher icons
        run: node scripts/apply-android-icons.mjs

      - name: Setup release signing
        run: |
          node scripts/setup-release-signing.mjs
          test -f android/app/release.keystore
          echo "==== build.gradle (signing) ===="
          grep -n -A20 "signingConfigs" android/app/build.gradle || true
          grep -n -A15 "release" android/app/build.gradle | head -40 || true
          ls -la android/app/release.keystore android/app/key.properties android/key.properties

      - name: Build RELEASE APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify release APK
        run: |
          test -f android/app/build/outputs/apk/release/app-release.apk
          ls -lh android/app/build/outputs/apk/release/app-release.apk
          cp android/app/build/outputs/apk/release/app-release.apk Chemix-release.apk

      - name: Publish release APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Chemix Release APK
          body: |
            **Release APK** для RuStore (не debug).
            Файл: Chemix-release.apk
            Package: app.chemix.game
          files: |
            android/app/build/outputs/apk/release/app-release.apk
            Chemix-release.apk
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
