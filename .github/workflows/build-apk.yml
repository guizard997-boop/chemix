name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build mobile web assets
        run: npm run build:mobile

      - name: Check icons in www
        run: |
          test -f www/index.html
          test -f www/icon.png || test -f www/ICON_KOLBA.png || test -f www/icons/icon-512.png
          ls -la www/*.png www/favicon.ico 2>/dev/null || ls -la www/icons/ | head

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Apply Chemix flask launcher icons
        run: node scripts/apply-android-icons.mjs

      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - name: Verify APK
        run: test -f android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Chemix APK
          body: |
            Chemix APK (Capacitor + иконка-колба).
            Скачайте `app-debug.apk` и установите на Android.
            Разрешите установку из неизвестных источников.
          files: android/app/build/outputs/apk/debug/app-debug.apk
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
